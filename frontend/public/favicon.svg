<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#0B0E12"/>
  <!-- Stylized "F" signal/waveform mark for The Forecaster -->
  <!-- Vertical bar of F -->
  <rect x="7" y="7" width="3" height="18" rx="1" fill="#7898C7"/>
  <!-- Top horizontal bar of F -->
  <rect x="7" y="7" width="13" height="3" rx="1" fill="#7898C7"/>
  <!-- Middle horizontal bar of F -->
  <rect x="7" y="14.5" width="10" height="2.5" rx="1" fill="#7898C7"/>
  <!-- Forecast trajectory "pulse" dots -->
  <circle cx="23" cy="16" r="1.5" fill="#7898C7" opacity="0.5"/>
  <circle cx="26.5" cy="13.5" r="1.5" fill="#7898C7" opacity="0.8"/>
  <circle cx="30" cy="11" r="1.5" fill="#7898C7"/>
</svg>
